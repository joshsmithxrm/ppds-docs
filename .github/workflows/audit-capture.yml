name: Audit Capture

# Manual-only. Capture executes without writer credentials; recording only handles data.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dev = local dev server, production = live docs URL'
        required: true
        default: 'dev'
        type: choice
        options: [dev, production]
      docs_url:
        description: 'Override DOCS_URL (otherwise defaults for mode)'
        required: false
        type: string
      branch_name:
        description: 'Existing or new capture/* branch in ppds-v1-audit; never default/protected branches'
        required: false
        type: string

concurrency:
  group: audit-capture-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      AUDIT_OUT: ${{ runner.temp }}/audit-out
      AUDIT_SOURCE_REPO: ${{ github.repository }}
      AUDIT_SOURCE_REF: ${{ github.ref }}
      AUDIT_SOURCE_COMMIT: ${{ github.sha }}
      DOCS_MODE: ${{ inputs.mode }}
      DOCS_URL: ${{ inputs.docs_url }}
    steps:
      - name: Checkout ppds-docs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit all dependencies
        run: npm audit --include=dev --audit-level=high
      - name: Verify dependency compatibility contracts
        run: npm run test:dependency-contracts
      - name: Check CI security invariants
        run: |
          node --test tools/ci/test-ci-security.mjs
          python -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Capture
        id: capture
        continue-on-error: true
        run: node tools/audit-capture.mjs run docs
      - name: Preserve capture artifact, including partial failures
        id: upload
        if: always() && steps.capture.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: docs-audit-capture
          path: ${{ env.AUDIT_OUT }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve capture failure status
        if: steps.capture.outcome != 'success'
        run: exit 1

  record:
    needs: capture
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AUDIT_OUT: ${{ runner.temp }}/audit-out
      AUDIT_SOURCE_REPO: ${{ github.repository }}
      AUDIT_SOURCE_REF: ${{ github.ref }}
      AUDIT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout validation code only
        uses: actions/checkout@v6
        with:
          path: trusted-source
          persist-credentials: false
      - name: Require capture artifact
        env:
          ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
      - name: Download this run's capture artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: ${{ env.AUDIT_OUT }}
          merge-multiple: true
      - name: Validate inert capture files and trusted source identity
        id: summary
        run: python trusted-source/tools/ci/audit_artifact.py "$AUDIT_OUT" --output "$GITHUB_OUTPUT"
      - name: Compute capture branch name
        id: branch
        env:
          REQUESTED_BRANCH: ${{ inputs.branch_name }}
        run: |
          BRANCH="${REQUESTED_BRANCH:-capture/$(date -u +%Y%m%d-%H%M%S)-docs}"
          case "$BRANCH" in capture/*) ;; *) echo 'Only capture/* branches are permitted'; exit 1;; esac
          [[ "$BRANCH" =~ ^capture/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          git check-ref-format --branch "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Mint narrowly scoped audit-repo token
        id: audit-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUDIT_APP_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          owner: joshsmithxrm
          repositories: ppds-v1-audit
          permission-contents: write
      - name: Checkout audit repo without retaining credentials
        uses: actions/checkout@v6
        with:
          repository: joshsmithxrm/ppds-v1-audit
          path: audit-repo
          token: ${{ steps.audit-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record validated capture data
        id: push
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
          APP_SLUG: ${{ steps.audit-token.outputs.app-slug }}
          DOCS_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=$(gh api repos/joshsmithxrm/ppds-v1-audit --jq .default_branch)
          test "$BRANCH" != "$DEFAULT_BRANCH"
          # Authentication applies only to these Git commands, never saved to disk.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git -C audit-repo config core.hooksPath /dev/null
          git -C audit-repo config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          git -C audit-repo config user.name "$APP_SLUG[bot]"
          REMOTE_REF=$(git -C audit-repo ls-remote --heads origin "refs/heads/$BRANCH")
          if [ -n "$REMOTE_REF" ]; then
            ENCODED_BRANCH=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$BRANCH")
            PROTECTED=$(gh api "repos/joshsmithxrm/ppds-v1-audit/branches/$ENCODED_BRANCH" --jq .protected)
            test "$PROTECTED" = false
            git -C audit-repo fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git -C audit-repo checkout -b "$BRANCH" "refs/remotes/origin/$BRANCH"
          else
            git -C audit-repo checkout -b "$BRANCH"
          fi
          python trusted-source/tools/ci/audit_artifact.py "$AUDIT_OUT" --destination audit-repo
          git -C audit-repo add -- manifest.json docs
          if git -C audit-repo diff --cached --quiet; then
            echo 'No changes to commit'
            echo 'commit_url=' >> "$GITHUB_OUTPUT"
          else
            git -C audit-repo commit -m "capture(docs): $AUDIT_SOURCE_COMMIT (mode=$DOCS_MODE)"
            git -C audit-repo push origin "HEAD:refs/heads/$BRANCH"
            SHA=$(git -C audit-repo rev-parse HEAD)
            echo "commit_url=https://github.com/joshsmithxrm/ppds-v1-audit/commit/$SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify webhook
        if: always()
        env:
          AUDIT_WEBHOOK_URL: ${{ secrets.AUDIT_WEBHOOK_URL }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
          RECORD_RESULT: ${{ job.status }}
          COMMIT_URL: ${{ steps.push.outputs.commit_url }}
          OK_COUNT: ${{ steps.summary.outputs.ok }}
          ERROR_COUNT: ${{ steps.summary.outputs.error }}
          SKIPPED_COUNT: ${{ steps.summary.outputs.skipped }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ.get('AUDIT_WEBHOOK_URL')
          if not url:
              print('AUDIT_WEBHOOK_URL not configured; skipping notification')
          else:
              content = ('Docs audit capture: ' + os.environ['CAPTURE_RESULT'] +
                         '; recording: ' + os.environ['RECORD_RESULT'] +
                         '; ' + (os.environ['COMMIT_URL'] or '(no commit)') +
                         '; ok/error/skipped: ' + '/'.join(os.environ[k] or '?' for k in ('OK_COUNT','ERROR_COUNT','SKIPPED_COUNT')) +
                         '; source ' + os.environ['AUDIT_SOURCE_COMMIT'] + '; ' + os.environ['RUN_URL'])
              request = urllib.request.Request(url, data=json.dumps({'content':content,'text':content}).encode(), headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status >= 400: raise RuntimeError('Webhook failed')
          PY
      - name: Fail recording when capture failed
        if: needs.capture.result != 'success' || steps.summary.outputs.error != '0'
        run: exit 1
