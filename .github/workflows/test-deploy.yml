name: Test Deployment

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --include=dev --audit-level=high

      - name: Verify dependency compatibility contracts
        run: npm run test:dependency-contracts

      - name: Check CI security invariants
        run: |
          node --test tools/ci/test-ci-security.mjs
          python -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Type check
        run: npm run typecheck

      - name: Test build
        run: npm run build
